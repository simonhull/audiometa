version: "2"

run:
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  default: all
  # Every linter is on except these, each by maintainer decision.
  disable:
    - exhaustruct     # forbids the zero-value struct literals and options the code relies on
    - wsl             # whitespace style churn, not defects (deprecated alias of wsl_v5)
    - wsl_v5          # whitespace style churn, not defects
    - nlreturn        # blank-line-before-return style churn
    - varnamelen      # short names (r, sr, n, off) are idiomatic in parsers
    - noinlineerr     # `if err := f(); err != nil` is the standard Go idiom
    - testpackage     # in-package tests of unexported code are deliberate
    - gosmopolitan    # non-Latin strings are test data for tag decoding
    - lll             # long format strings and tables; gofumpt owns layout
    - tagalign        # struct tag alignment is formatting churn
    - exhaustruct_v5  # the exhaustruct family again (see exhaustruct)
    - gomodguard      # deprecated upstream (replaced by gomodguard_v2, which stays on)

  settings:
    depguard:
      rules:
        banned:
          files:
            - $all
          deny:
            - pkg: io/ioutil
              desc: deprecated since Go 1.16; use io and os
            - pkg: math/rand$
              desc: use math/rand/v2
            - pkg: github.com/pkg/errors
              desc: use the standard errors package and fmt.Errorf with %w
            - pkg: golang.org/x/exp
              desc: its useful parts live in the standard library (slices, maps, cmp)
            - pkg: encoding/json$
              desc: use encoding/json/v2
        no-log:
          # Examples and godoc examples are runnable demos that report fatal errors with log.
          files:
            - $all
            - "!**/examples/**"
            - "!**/example*_test.go"
          deny:
            - pkg: log$
              desc: libraries do not log; return errors or warnings
    cyclop:
      # The same bound as gocyclo below, so the two cannot disagree.
      max-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*github.com/simonhull/audiometa.File).Close
    funlen:
      # Binary-format parsers read many fields in sequence; the defaults (60 lines, 40
      # statements) split them into fragments that read worse than the sequence.
      lines: 100
      statements: 50
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - diagnostic
        - performance
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104   # Duplicate of errcheck
        - G304   # File path from variable - this library opens user-provided paths by design
        - G307   # Deferred file close - false positives on best-effort cleanup
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    misspell:
      locale: US
    ireturn:
      # Seams return io.ReaderAt, io.Reader and friends on purpose; errors and the standard
      # library's interfaces are fine to return.
      allow:
        - error
        - stdlib
        - empty
        - anon
        - generic
    mnd:
      # Binary-format parsers are sequences of field offsets, sizes and masks that the format
      # specifications name; a constant per number reads worse than the spec table beside it.
      ignored-files:
        - internal/(flac|m4a|mp3|ogg|iff|vorbis|imagemeta|picture|trailer)/
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 5
    wrapcheck:
      # Errors from this module's own packages already carry their context, and a context
      # error must reach the caller as ctx.Err() so errors.Is(err, context.Canceled) holds.
      ignore-package-globs:
        - github.com/simonhull/audiometa/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - (context.Context).Err()
        - .Err()
        # io.Reader, io.ReaderAt, io.Writer and io.Closer wrappers and fakes must pass io.EOF
        # and the underlying error through unchanged; callers compare them with errors.Is.
        - .ReadAt(
        - .Write(
        - .WriteAt(
        - .Close()
        - .Sync()
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        # Requires doc comments on every exported identifier (staticcheck ST1020-22 checks their form).
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: confusing-naming
    staticcheck:
      checks:
        - all
        - -ST1003

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
    rules:
      # Tests are linted like production code; only these checks are relaxed for them.
      # Tables of expected values are naturally magic numbers, test bodies are long, tests
      # build ad-hoc errors, and tests open fixture paths from variables.
      - path: _test\.go
        linters:
          - mnd
          - funlen
          - err113
      - path: _test\.go
        linters: [gosec]
        text: "G304"
      - path: _test\.go
        linters:
          - staticcheck
        text: "QF"

      # cmd/ tools are utilities, not library code
      - path: cmd/
        linters:
          - errcheck
          - forcetypeassert
          - gocritic
          - gocyclo
          - gosec
          - nestif
          - revive

      # Default file permissions - intentional 0o644 for artwork extraction
      - linters: [gosec]
        text: "G301|G306"
      # Examples are simple demos; they can use log.Fatalf and don't need
      # the same complexity gates as library code.
      - linters: [gocritic]
        path: examples/
        text: "exitAfterDefer"
      - linters: [gocyclo]
        path: examples/
      # Examples take user paths (file globs, output dirs); G703/G706 are taint
      # warnings appropriate for servers, not for CLI demos.
      - linters: [gosec]
        path: examples/
        text: "G703|G706"
      # Test fixtures pre-allocate slices and append into them; the capacity is
      # an upper bound, not a length guarantee.
      - linters: [makezero]
        path: _test\.go
      # The CLI is the program edge: it prints the error it receives, and wrapping would change
      # the text users and scripts see.
      - linters: [wrapcheck]
        path: ^cmd/audiometa/
      # Chapter's JSON tags are part of its public encoding, and the oracle test decodes
      # ffprobe's snake_case output; neither can follow a case convention.
      - linters: [tagliatelle]
        path: ^(internal/types/chapter\.go|write_oracle_test\.go)$
      # The CLI's JSON field names are its output format: renaming them to satisfy a case
      # convention would change what scripts parse.
      - linters: [tagliatelle]
        path: ^cmd/audiometa/
      # Formats register themselves with the registry in init(); that is the design (a blank
      # import of a format package is what enables it).
      - linters: [gochecknoinits]
        path: ^internal/(flac|m4a|mp3|ogg|iff)/
        source: '^func init\(\)'
      # The examples are linear demos read top to bottom; splitting main hides the walkthrough.
      - linters: [funlen, gocognit, cyclop]
        path: ^examples/
      # The examples are CLI demos whose output is fmt.Print*.
      - linters: [forbidigo]
        path: ^examples/
      # InPlacePatch returns (nil, nil) for "this edit does not fit in place, rewrite instead"
      # on purpose (plan 074, Decision 5): a nil plan is not an error, and a sentinel would
      # make every caller unwrap it again.
      - linters: [nilnil]
        path: ^internal/(flac|m4a|mp3|ogg)/writer\.go$
        source: 'return nil, nil'
      # Map keys with trailing spaces are part of the audio format spec (4-char atom names)
      - linters: [gocritic]
        text: "mapKey: suspicious whitespace"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false # every linter reports its own finding on a shared line
  new: false

formatters:
  enable:
    - gofumpt
    - goimports
