name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Require the tag to be on main
      run: |
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
          echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

    - name: Run GoReleaser
      run: mise exec -- goreleaser release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
