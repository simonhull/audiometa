name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tool versions come from mise.toml only.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

    - name: Verify dependencies
      run: mise run verify-mod

    - name: Check go.mod is tidy
      run: mise run tidy-check

    - name: Run tests
      run: mise run test

    - name: Run tests (32-bit)
      run: mise run test386

    - name: Coverage summary
      run: mise exec -- go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: coverage.out

    - name: Vulnerability scan
      run: mise run vuln

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Keep line endings as committed
      run: git config --global core.autocrlf false

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Only Go is needed here; the other pinned tools are Linux-side gates.
    - name: Install Go
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        install_args: go

    - name: Run tests
      run: mise exec -- go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

    - name: Lint
      run: mise run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

    - name: Build
      run: mise run build

    - name: Vet other platforms
      run: |
        GOOS=windows mise exec -- go vet ./...
        GOOS=darwin mise exec -- go vet ./...

    - name: Verify generated code is fresh
      run: mise run generate-check

  write-gate:
    name: Write gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

    - name: Install oracles
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg flac

    - name: Write gate
      run: mise run write-gate

    - name: Upload fuzz crashers
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-crashers
        path: testdata/fuzz

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

    - name: Fuzz every target
      run: mise exec -- scripts/fuzz.sh 20s

    - name: Upload fuzz crashers
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-crashers-all
        path: '**/testdata/fuzz'
